.item .meta{min-width:0}

.empty,.note{color:var(--muted); font-size:14px; margin:0}

function debtCalc(){
  var f = document.querySelector('form[data-form="debt"]');
  var out = $('debt-calc');
  if(!f || !out) return;
  var name = f.elements.gname.value.trim(), q = parseFloat(f.elements.gqty.value);
  var pEl = f.elements.gprice, p = parseFloat(pEl.value);
  var si = stockMatch(name);
  if(si && pEl.getAttribute('data-touched') !== '1'){ pEl.value = si.price; p = si.price; }
  if(!name){ out.textContent = ''; return; }
  if(!(q > 0)) q = 1;

}
function goodsCount(){ return S.debts.reduce(function(a,d){ return a + d.goods.length; }, 0); }
function addDebt(name, amount, good){
  var n = name.trim(), key = n.toLowerCase();
  var d = S.debts.find(function(x){ return x.customer.toLowerCase() === key; });
  if(!d){ d = {id:uid(), customer:n, amount:0, goods:[], ts:Date.now()}; S.debts.push(d); }
  d.amount += (+amount || 0); d.ts = Date.now();
  if(good && good.name && good.qty > 0){
    var g = d.goods.find(function(x){ return x.name.toLowerCase() === good.name.toLowerCase(); });
    if(g) g.qty += good.qty; else d.goods.push({id:uid(), name:good.name, qty:good.qty});
  }
  return d;
}
function returnGoods(did, gid, qty){
  var d = S.debts.find(function(x){ return x.id === did; });
  if(!d) return false;
  var g = d.goods.find(function(x){ return x.id === gid; });
  if(!g) return false;
  var q = Math.min(+qty || 0, g.qty);
  if(!(q > 0)) return false;
  g.qty -= q;
  if(g.qty < 0.0005) d.goods = d.goods.filter(function(x){ return x.id !== gid; });
  tidyDebts(); save(); return true;
}
function completeSale(customer){
  var lines = [], total = 0;
  ui.cart.forEach(function(c){
    var it = S.items.find(function(i){ return i.id === c.id; });
    if(!it) return;
    lines.push({id:it.id, name:it.name, qty:c.qty, price:it.price, cost:it.cost});
    total += it.price * c.qty;
    if(tracked(it)) it.qty = Math.max(0, (+it.qty||0) - c.qty);
  });
  if(!lines.length) return 0;
  S.sales.push({id:uid(), ts:Date.now(), lines:lines, total:total, credit:customer||null});
  if(customer) addDebt(customer, total);
  ui.cart = []; save();
  return total;
}
function receivePayment(id, amount){
  var d = S.debts.find(function(x){ return x.id === id; });
  if(!d) return false;
  var a = Math.min(+amount||0, d.amount);
  if(!(a > 0)) return false;
  d.amount -= a;
  S.pay.push({id:uid(), ts:Date.now(), customer:d.customer, amount:a});

  save(); return true;
}
function report(days){
  var from = startOfToday() - (days-1)*DAY;
  var sales = S.sales.filter(function(s){ return s.ts >= from && !s.void; });
  var total = 0, credit = 0, profit = 0, sold = 0, by = {};
  sales.forEach(function(s){
    total += s.total; if(s.credit) credit += s.total;
    s.lines.forEach(function(l){
      sold += l.qty;
      if(l.cost !== null && l.cost !== '' && l.cost !== undefined && !isNaN(l.cost)) profit += (l.price - l.cost) * l.qty;
      by[l.name] = (by[l.name]||0) + l.qty;
    });
  });
  var paid = S.pay.filter(function(p){ return p.ts >= from; }).reduce(function(a,p){ return a + p.amount; }, 0);
  var top = Object.keys(by).map(function(k){ return [k, by[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
  return {count:sales.length, total:total, credit:credit, profit:profit, sold:sold, paid:paid, cashIn:(total-credit)+paid, top:top};
}

function copyText(text, onDone){

  try{

    else fallback();

function act(a, d){
  if(a !== 'del' && a !== 'restore' && a !== 'changebiz' && a !== 'void') ui.armed = null;
  if(OWNER_ONLY[a] && !isOwner()){ toast(t('ownerOnly')); return; }
  var keep = false;
  switch(a){
    case 'tab': ui.tab = d.tab; ui.creditOpen = false; ui.edit = null; ui.addOpen = false; ui.payOpen = null; ui.debtAdd = false; ui.retOpen = null; ui.debtFor = ''; break;
    case 'lang': S.lang = S.lang === 'en' ? 'am' : 'en'; save(); break;
    case 'add': {
      var ait = S.items.find(function(x){ return x.id === d.id; });
      if(ait && expState(ait) === 'bad' && ui.expAsk !== d.id){ ui.expAsk = d.id; toast(t('askExpired')); return; }
      ui.expAsk = null;
      var c = ui.cart.find(function(x){ return x.id === d.id; });
      if(c) c.qty++; else ui.cart.push({id:d.id, qty:1});
      $('cartbox').innerHTML = cartHtml(); return;
    }
    case 'inc': ui.cart.forEach(function(x){ if(x.id === d.id) x.qty++; }); $('cartbox').innerHTML = cartHtml(); return;
    case 'dec': ui.cart.forEach(function(x){ if(x.id === d.id) x.qty--; }); ui.cart = ui.cart.filter(function(x){ return x.qty > 0; });
      if(!ui.cart.length) ui.creditOpen = false; $('cartbox').innerHTML = cartHtml(); return;
    case 'cash': { var tot = completeSale(null); if(tot){ toast(t('saved') + ': ' + money(tot) + ' ' + t('birr')); } break; }
    case 'credit-open': ui.creditOpen = true; break;
    case 'credit-close': ui.creditOpen = false; break;
    case 'clearex': clearExamples(); break;
    case 'openadd': ui.addOpen = true; ui.edit = null; break;
    case 'closeform': ui.addOpen = false; ui.edit = null; ui.newBarcode = ''; break;
    case 'edit': ui.edit = d.id; ui.addOpen = false; break;
    case 'del':
      if(ui.armed === 'del-' + d.id){ S.items = S.items.filter(function(i){ return i.id !== d.id; }); ui.cart = ui.cart.filter(function(x){ return x.id !== d.id; }); ui.edit = null; ui.armed = null; save(); }
      else ui.armed = 'del-' + d.id;
      break;
    case 'payopen': ui.payOpen = d.id; break;
    case 'payclose': ui.payOpen = null; break;
    case 'debtopen': ui.debtAdd = true; ui.debtFor = ''; break;
    case 'debtfor': var dd = S.debts.find(function(x){ return x.id === d.id; }); ui.debtAdd = true; ui.debtFor = dd ? dd.customer : ''; break;
    case 'debtclose': ui.debtAdd = false; ui.debtFor = ''; break;
    case 'retopen': ui.retOpen = d.id; break;
    case 'retclose': ui.retOpen = null; break;
    case 'lock': ui.owner = false; ui.tab = 'sell'; break;
    case 'scansell': openScanner(sellScanCode, t('scanSell')); return;
    case 'scanfill': { var fid = d.id; openScanner(function(code){ closeScanner(); var el = document.getElementById('f-' + fid + '-barcode'); if(el) el.value = code; }, t('scanBtn')); return; }
    case 'scanclose': closeScanner(); return;
    case 'scanadd': { var bc = $('scan-add').getAttribute('data-code') || ''; closeScanner(); ui.newBarcode = bc; ui.tab = 'stock'; ui.addOpen = true; ui.edit = null; break; }
    case 'warn': S.warnDays = +d.d; save(); break;
    case 'togcredit': S.allowCredit = !S.allowCredit; save(); break;
    case 'void': if(ui.armed === 'void-' + d.id){ voidSale(d.id); ui.armed = null; toast(t('voided')); } else ui.armed = 'void-' + d.id; break;
    case 'sendsum': { var stx = empSummaryText(); if(navigator.share){ navigator.share({text:stx}).catch(function(){}); } else copyText(stx); return; }
    case 'biz': applyBiz(d.id); ui.picking = false; ui.tab = 'sell'; break;
    case 'picktype': ui.picking = true; break;
    case 'pickback': ui.picking = false; break;
    case 'changebiz': if(ui.armed === 'changebiz'){ S.biz = null; save(); ui.armed = null; } else ui.armed = 'changebiz'; break;
    case 'range': ui.range = +d.d; break;
    case 'copysum': copyText(summaryText(ui.range)); return;
    case 'copybk': ui.bk = JSON.stringify(S); copyText(ui.bk, function(){ lsSet(BK_KEY, String(Date.now())); render(); }); break;
    case 'sharebk': shareBackup(); return;
    case 'undorestore': { var pr = lsGet(PRE_KEY); if(pr){ try{ var po = JSON.parse(pr); normDebts(po); S = po; save(); try{ localStorage.removeItem(PRE_KEY); }catch(e){} toast(t('undone')); }catch(e){ toast(t('bad')); } } break; }
    case 'restore': {
      var ta = $('rs'); var txt = ta ? ta.value : '';
      if(ui.armed !== 'restore'){ ui.armed = 'restore'; ui.bk = txt; break; }
      try{
        var o = JSON.parse(txt);
        if(!o || !Array.isArray(o.items) || !Array.isArray(o.sales)) throw new Error('bad');
        o.debts = o.debts || []; o.pay = o.pay || []; o.lang = o.lang || 'en';
        lsSet(PRE_KEY, JSON.stringify(S)); normDebts(o); S = o; save(); ui.armed = null; ui.bk = ''; toast(t('restored'));
      }catch(e){ ui.armed = null; ui.bk = txt; toast(t('bad')); }
      break;
    }
  }
  render();
}
function num(form, name){ var el = form.elements[name]; if(!el || el.value === '') return null; var v = parseFloat(el.value); return isNaN(v) ? null : v; }
function submit(form){
  var kind = form.getAttribute('data-form'), id = form.getAttribute('data-id');
  if(kind === 'activate'){
    if(ui.actLock && Date.now() < ui.actLock){ toast(t('actWait')); return; }
    var cv = normCode(form.elements.code.value);
    if(cv.length === 10 && ACT_HASHES.indexOf(actHash(cv)) >= 0){
      var hh = actHash(cv); actMem = hh; try{ localStorage.setItem(ACT_KEY, hh); }catch(e){}
      ui.actErr = false; ui.actTries = 0; toast(t('actOk'));
    } else {
      ui.actErr = true; ui.actTries = (ui.actTries || 0) + 1;
      if(ui.actTries >= 5){ ui.actLock = Date.now() + 30000; ui.actTries = 0; toast(t('actWait')); }
    }
    render(); return;
  }
  if((kind === 'item' || kind === 'debt' || kind === 'ret') && !isOwner()){ toast(t('ownerOnly')); return; }
  if(kind === 'scanmanual'){ var mv = form.elements.code.value.trim(); if(mv){ gotCode(mv); form.elements.code.value = ''; } return; }
  if(kind === 'item'){
    var name = form.elements.name.value.trim(), price = num(form,'price');
    if(!name || price === null) { toast(t('fix')); return; }
    var rec = {name:name, price:price, cost:num(form,'cost'), qty:num(form,'qty') || 0, low:num(form,'low') === null ? 5 : num(form,'low'),
      unit:form.elements.unit ? form.elements.unit.value : 'piece', expiry:form.elements.expiry ? form.elements.expiry.value : '', track:form.elements.track ? form.elements.track.checked : true, barcode:form.elements.barcode ? form.elements.barcode.value.trim() : ''};
    if(rec.barcode){ var dup = S.items.find(function(x){ return x.barcode === rec.barcode && x.id !== id; }); if(dup){ toast(t('barcodeUsed') + ' ' + dup.name); return; } }
    if(id){ var it = S.items.find(function(x){ return x.id === id; }); if(it){ it.name = rec.name; it.price = rec.price; it.cost = rec.cost; it.qty = rec.qty; it.low = rec.low; it.unit = rec.unit; it.expiry = rec.expiry; it.track = rec.track; it.barcode = rec.barcode; } }
    else S.items.push({id:uid(), name:rec.name, price:rec.price, cost:rec.cost, qty:rec.qty, low:rec.low, unit:rec.unit, expiry:rec.expiry, track:rec.track, barcode:rec.barcode});
    ui.edit = null; ui.addOpen = false; ui.newBarcode = ''; save(); render(); return;
  }
  if(kind === 'credit'){
    var cust = form.elements.cust.value.trim(); if(!cust) return;
    if(needsApproval() && !verifyPin(form.elements.pin ? form.elements.pin.value : '')){ toast(t('wrongPin')); return; }
    var tot = completeSale(cust); ui.creditOpen = false;
    if(tot) toast(t('saved') + ': ' + money(tot) + ' ' + t('birr')); render(); return;
  }
  if(kind === 'unlock'){
    if(verifyPin(form.elements.pin.value)){ ui.owner = true; ui.tab = 'report'; } else toast(t('wrongPin'));
    render(); return;
  }
  if(kind === 'setpin'){
    var np = form.elements.pin.value.trim(), rw = form.elements.rec ? form.elements.rec.value.trim().toLowerCase() : '';
    if(!/^\d{4,6}$/.test(np)){ toast(t('pinBad')); return; }
    if(!S.rec && !rw){ toast(t('recNeed')); return; }
    S.pin = hashStr('pin:' + np); if(rw) S.rec = hashStr('rec:' + rw);
    ui.owner = true; save(); toast(t('pinSet')); render(); return;
  }
  if(kind === 'resetpin'){
    var rw2 = form.elements.rec.value.trim().toLowerCase(), np2 = form.elements.pin.value.trim();
    if(!S.rec || hashStr('rec:' + rw2) !== S.rec){ toast(t('recWrong')); return; }
    if(!/^\d{4,6}$/.test(np2)){ toast(t('pinBad')); return; }
    S.pin = hashStr('pin:' + np2); ui.owner = true; ui.tab = 'report'; save(); toast(t('pinSet')); render(); return;
  }
  if(kind === 'pay'){ if(receivePayment(id, num(form,'amt'))) toast(t('saved')); ui.payOpen = null; render(); return; }
  if(kind === 'ret'){ if(returnGoods(id, form.getAttribute('data-gid'), num(form,'rq'))) toast(t('saved')); ui.retOpen = null; render(); return; }
  if(kind === 'debt'){
    var n = form.elements.cust.value.trim(), a = num(form,'amt') || 0;
    var gname = form.elements.gname.value.trim(), gq = num(form,'gqty');
    if(gname && !(gq > 0)) gq = 1;
    var good = gname ? {name:gname, qty:gq} : null;
    var gp = num(form,'gprice');
    if(good && !(gp > 0)){ var si = stockMatch(gname); if(si && si.price > 0) gp = si.price; }
    if(good && gp > 0){ a += gq * gp; good = null; }
    if(n && (a > 0 || good)){ addDebt(n, a, good); save(); ui.debtAdd = false; ui.debtFor = ''; toast(t('saved')); render(); }
    else toast(t('needOne'));
  }
}

  if(e.target && (e.target.id === 'debt-gname' || e.target.id === 'debt-gqty' || e.target.id === 'debt-gprice')) debtCalc();
});
render();
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
